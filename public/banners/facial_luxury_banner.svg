<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" fill="none">
  <defs>
    <!-- Background Gradient: Pearlescent Warm Rose & Alabaster -->
    <linearGradient id="facialBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF8F5"/>
      <stop offset="50%" stop-color="#F7ECE5"/>
      <stop offset="100%" stop-color="#EEDBD2"/>
    </linearGradient>

    <!-- Radiant Gold & Champagne Glow -->
    <radialGradient id="radiantGlow" cx="72%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#F1D7B4" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#E5C799" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FCF8F5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="roseAccent" cx="22%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#8C2D43" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#4A0417" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Serum Droplet Gradient -->
    <linearGradient id="goldSerum" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DE"/>
      <stop offset="30%" stop-color="#F2C879"/>
      <stop offset="70%" stop-color="#D49B37"/>
      <stop offset="100%" stop-color="#996919"/>
    </linearGradient>

    <!-- Glass Bottle Gradient -->
    <linearGradient id="frostedGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F3E5DE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Jade Roller Head Gradient -->
    <linearGradient id="roseQuartz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAD9DA"/>
      <stop offset="40%" stop-color="#EDB3B6"/>
      <stop offset="80%" stop-color="#D99196"/>
      <stop offset="100%" stop-color="#B86C72"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="facialShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4A0417" flood-opacity="0.1"/>
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layers -->
  <rect width="1600" height="900" fill="url(#facialBg)"/>
  <rect width="1600" height="900" fill="url(#radiantGlow)"/>
  <rect width="1600" height="900" fill="url(#roseAccent)"/>

  <!-- Minimalist Structural Coordinates -->
  <g opacity="0.08" stroke="#4A0417" stroke-width="1">
    <line x1="140" y1="0" x2="140" y2="900"/>
    <line x1="520" y1="0" x2="520" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
    <line x1="1260" y1="0" x2="1260" y2="900"/>
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="700" x2="1600" y2="700"/>
  </g>

  <!-- Sacred Geometry Radiance Circles -->
  <circle cx="1140" cy="450" r="340" stroke="#C5A880" stroke-width="1" stroke-dasharray="3 7" opacity="0.45"/>
  <circle cx="1140" cy="450" r="410" stroke="#4A0417" stroke-width="1" opacity="0.12"/>
  <circle cx="1140" cy="450" r="270" stroke="#C5A880" stroke-width="0.8" opacity="0.3"/>

  <!-- Left Side: Editorial Typography & Clinical Safety -->
  <g transform="translate(140, 220)">
    <!-- Badge -->
    <rect x="0" y="0" width="280" height="36" rx="18" fill="#4A0417" fill-opacity="0.08"/>
    <rect x="0" y="0" width="280" height="36" rx="18" stroke="#4A0417" stroke-width="1" stroke-opacity="0.2"/>
    <circle cx="18" cy="18" r="4" fill="#4A0417"/>
    <text x="32" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#4A0417" text-transform="uppercase">
      BEAUTYDOOR DERMA CARE
    </text>

    <!-- Main Title -->
    <text x="0" y="110" font-family="'Playfair Display', serif" font-size="64" font-weight="400" fill="#1F1A1C" letter-spacing="-1">
      Botanical Radiance
    </text>
    <text x="0" y="185" font-family="'Playfair Display', serif" font-size="64" font-style="italic" font-weight="500" fill="#4A0417" letter-spacing="-1">
      &amp; O3+ Derma Facials.
    </text>

    <!-- Subtitle -->
    <text x="0" y="245" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="400" fill="#6B5A5C">
      <tspan x="0" dy="0">Customized skin diagnostics with authentic Cheryl's &amp; Lotus packs.</tspan>
      <tspan x="0" dy="30">Unsealed directly at your vanity in sterile monodosage kits.</tspan>
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 330)">
      <g transform="translate(0, 0)">
        <rect width="190" height="42" rx="8" fill="#FFFFFF" stroke="#E8DDD3" stroke-width="1" filter="url(#facialShadow)"/>
        <text x="18" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#4A0417">O3+ Oxygenating</text>
      </g>
      <g transform="translate(206, 0)">
        <rect width="180" height="42" rx="8" fill="#FFFFFF" stroke="#E8DDD3" stroke-width="1" filter="url(#facialShadow)"/>
        <text x="18" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#4A0417">Sealed Monodose</text>
      </g>
      <g transform="translate(402, 0)">
        <rect width="180" height="42" rx="8" fill="#FFFFFF" stroke="#E8DDD3" stroke-width="1" filter="url(#facialShadow)"/>
        <text x="18" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#4A0417">Pure Glow Finish</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Luxury Facial Treatment Aesthetic Art -->
  <g transform="translate(1140, 450)">
    
    <!-- Base Alabaster Plinth -->
    <ellipse cx="0" cy="180" rx="270" ry="55" fill="#E2D2C8" fill-opacity="0.5" filter="url(#facialShadow)"/>
    <ellipse cx="0" cy="170" rx="250" ry="46" fill="#FBF5F1"/>

    <!-- Travertine Spa Dish -->
    <ellipse cx="20" cy="120" rx="220" ry="38" fill="#FFFFFF" filter="url(#facialShadow)"/>
    <ellipse cx="20" cy="116" rx="210" ry="34" fill="#F9ECE4"/>
    <ellipse cx="20" cy="114" rx="200" ry="31" stroke="#DDA899" stroke-width="1.5" fill="none"/>

    <!-- Elegant Aesthetic Female Face Silhouette in Golden Ratio (Minimalist Outline) -->
    <g transform="translate(-40, -90)" filter="url(#facialShadow)">
      <!-- Soft Radiance Aura -->
      <circle cx="30" cy="40" r="140" fill="#F8E5D8" fill-opacity="0.45"/>
      <circle cx="30" cy="40" r="110" fill="#FFF4EE" fill-opacity="0.75"/>
      
      <!-- Minimalist Sculpted Profile Contour -->
      <path d="M -10,-80 
               C 20,-80 50,-60 60,-30 
               C 65,-15 70,0 78,15 
               C 85,28 75,35 60,38 
               C 70,45 68,58 55,62 
               C 45,66 40,75 42,90 
               C 44,105 20,115 -10,120" 
            stroke="#4A0417" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      
      <!-- Serene Closed Eyelid & Brow Accent -->
      <path d="M 22,-5 Q 38,-15 52,-8" stroke="#4A0417" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M 28,12 Q 40,24 50,14" stroke="#4A0417" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      
      <!-- Lip Highlight Contour -->
      <path d="M 46,62 Q 54,60 58,64" stroke="#8C2D43" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M 44,72 Q 52,78 56,70" stroke="#8C2D43" stroke-width="2" stroke-linecap="round" fill="none"/>

      <!-- Delicate Star Radiance Marks on Skin (Glow Indicator) -->
      <g transform="translate(15, 30)">
        <path d="M 0,-8 L 0,8 M -8,0 L 8,0" stroke="#C5A880" stroke-width="2" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="2" fill="#E5C799"/>
      </g>
      <g transform="translate(45, -30)">
        <path d="M 0,-6 L 0,6 M -6,0 L 6,0" stroke="#C5A880" stroke-width="1.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Frosted Glass Serum Bottle with Precision Gold Dropper -->
    <g transform="translate(130, -30)" filter="url(#facialShadow)">
      <!-- Bottle Body -->
      <rect x="-24" y="0" width="48" height="90" rx="12" fill="url(#frostedGlass)"/>
      <rect x="-20" y="4" width="10" height="82" rx="5" fill="#FFFFFF" fill-opacity="0.6"/>
      <!-- Inner Golden Essence Level -->
      <rect x="-20" y="32" width="40" height="52" rx="8" fill="url(#goldSerum)" fill-opacity="0.85"/>
      <!-- Minimalist Label -->
      <rect x="-22" y="42" width="44" height="32" rx="4" fill="#FFFFFF"/>
      <rect x="-14" y="50" width="28" height="2" fill="#4A0417"/>
      <rect x="-10" y="56" width="20" height="1.5" fill="#C5A880"/>
      <!-- Gold Collar -->
      <rect x="-16" y="-12" width="32" height="12" rx="3" fill="#D49B37"/>
      <!-- Rubber Pipette Bulb -->
      <path d="M -12,-12 C -12,-30 12,-30 12,-12 Z" fill="#4A0417"/>
    </g>

    <!-- Suspended Glass Dropper Dispensing Luminous Gold Elixir -->
    <g transform="translate(80, -120)" filter="url(#facialShadow)">
      <!-- Glass Pipette Stem -->
      <rect x="-5" y="-30" width="10" height="70" rx="4" fill="#FFFFFF" fill-opacity="0.75" stroke="#E8DDD3" stroke-width="1"/>
      <rect x="-3" y="0" width="6" height="38" rx="2" fill="url(#goldSerum)"/>
      <path d="M -5,40 L 0,55 L 5,40 Z" fill="#FFFFFF" fill-opacity="0.85"/>
      
      <!-- Perfectly Suspended Teardrop of Golden Glow Elixir -->
      <g transform="translate(0, 68)" filter="url(#glowFilter)">
        <path d="M 0,0 C -8,12 -10,22 0,26 C 10,22 8,12 0,0 Z" fill="url(#goldSerum)"/>
        <!-- Specular Highlight -->
        <ellipse cx="-2.5" cy="15" rx="2" ry="5" fill="#FFFFFF" fill-opacity="0.85" transform="rotate(-15 -2.5 15)"/>
      </g>
    </g>

    <!-- Genuine Rose Quartz Facial Roller -->
    <g transform="translate(-140, 50) rotate(-22)" filter="url(#facialShadow)">
      <!-- Large Roller Head -->
      <rect x="-12" y="-55" width="24" height="50" rx="12" fill="url(#roseQuartz)"/>
      <!-- Golden Prongs Holding Stone -->
      <path d="M 0,-55 L 0,-62 C 0,-70 24,-70 24,-62 L 24,-55" stroke="#C5A880" stroke-width="3" fill="none"/>
      <path d="M 0,-5 L 0,2 C 0,10 24,10 24,2 L 24,-5" stroke="#C5A880" stroke-width="3" fill="none"/>
      <!-- Gold Stem & Handle Connection -->
      <path d="M 12,-66 L 12,-10 L 35,30" stroke="#C5A880" stroke-width="3.5" fill="none"/>
      <!-- Rose Quartz Cylindrical Handle -->
      <rect x="25" y="30" width="18" height="80" rx="9" fill="url(#roseQuartz)"/>
      <rect x="27" y="33" width="4" height="74" rx="2" fill="#FFFFFF" fill-opacity="0.45"/>
    </g>

    <!-- Pristine Botanical Lotus / Camellia Blossom -->
    <g transform="translate(18, 120)" filter="url(#facialShadow)">
      <!-- Outer Petals -->
      <path d="M 0,0 C -30,-20 -50,-5 0,20 C 50,-5 30,-20 0,0 Z" fill="#F7D8D8"/>
      <path d="M 0,0 C -45,-35 -15,-45 0,20 C 15,-45 45,-35 0,0 Z" fill="#FFFFFF"/>
      <path d="M 0,15 C -25,-10 -5,-35 0,-15 C 5,-35 25,-10 0,15 Z" fill="#FCEDE8"/>
      <!-- Gold Core Stamen -->
      <circle cx="0" cy="-2" r="5" fill="#E5C799"/>
      <circle cx="0" cy="-2" r="2.5" fill="#C5A880"/>
    </g>

  </g>

  <!-- Bottom Aesthetic Border -->
  <rect x="0" y="892" width="1600" height="8" fill="#4A0417"/>
  <rect x="0" y="892" width="480" height="8" fill="#C5A880"/>
</svg>
