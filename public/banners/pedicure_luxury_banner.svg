<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" fill="none">
  <defs>
    <!-- Background Gradient: Warm Mineral & Travertine Linen -->
    <linearGradient id="pediBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="50%" stop-color="#F3ECE4"/>
      <stop offset="100%" stop-color="#E7DDD3"/>
    </linearGradient>

    <!-- Warm Rose Petal & Gold Radiance -->
    <radialGradient id="roseWaterGlow" cx="70%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#F2D1D7" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#C5A880" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FAF7F2" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="burgundyPedi" cx="18%" cy="28%" r="46%">
      <stop offset="0%" stop-color="#4A0417" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#4A0417" stop-opacity="0"/>
    </radialGradient>

    <!-- Ceramic Spa Basin Gradient -->
    <linearGradient id="ceramicBasin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F7F3EE"/>
      <stop offset="100%" stop-color="#E8DFD5"/>
    </linearGradient>

    <!-- Warm Spa Water Shimmer -->
    <linearGradient id="spaWater" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FBF2F4"/>
      <stop offset="40%" stop-color="#F6E4E7"/>
      <stop offset="80%" stop-color="#ECD0D6"/>
      <stop offset="100%" stop-color="#DEB8C0"/>
    </linearGradient>

    <!-- Fresh Velvety Rose Petal Gradient -->
    <linearGradient id="rosePetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8F142E"/>
      <stop offset="50%" stop-color="#69091F"/>
      <stop offset="100%" stop-color="#3D020F"/>
    </linearGradient>

    <linearGradient id="lightPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D94B66"/>
      <stop offset="70%" stop-color="#9E1E38"/>
      <stop offset="100%" stop-color="#5E061B"/>
    </linearGradient>

    <!-- Volcanic Basalt Spa Stone -->
    <linearGradient id="basaltStone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4546"/>
      <stop offset="50%" stop-color="#2D2829"/>
      <stop offset="100%" stop-color="#181516"/>
    </linearGradient>

    <!-- Stainless Steel Surgical Tool Shimmer -->
    <linearGradient id="surgicalSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#D9D9D9"/>
      <stop offset="70%" stop-color="#B3B3B3"/>
      <stop offset="100%" stop-color="#808080"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="pediShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#4A0417" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="900" fill="url(#pediBg)"/>
  <rect width="1600" height="900" fill="url(#roseWaterGlow)"/>
  <rect width="1600" height="900" fill="url(#burgundyPedi)"/>

  <!-- Minimalist Geometric Cadence -->
  <g opacity="0.08" stroke="#4A0417" stroke-width="1">
    <line x1="130" y1="0" x2="130" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="880" y1="0" x2="880" y2="900"/>
    <line x1="1240" y1="0" x2="1240" y2="900"/>
    <line x1="0" y1="190" x2="1600" y2="190"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="710" x2="1600" y2="710"/>
  </g>

  <!-- Orbital Rings of Balance -->
  <circle cx="1130" cy="460" r="330" stroke="#C5A880" stroke-width="1" stroke-dasharray="4 8" opacity="0.45"/>
  <circle cx="1130" cy="460" r="400" stroke="#4A0417" stroke-width="1" opacity="0.12"/>

  <!-- Left Side: Editorial Typography & Spa Promise -->
  <g transform="translate(140, 220)">
    <!-- Badge -->
    <rect x="0" y="0" width="280" height="36" rx="18" fill="#4A0417" fill-opacity="0.08"/>
    <rect x="0" y="0" width="280" height="36" rx="18" stroke="#4A0417" stroke-width="1" stroke-opacity="0.2"/>
    <circle cx="18" cy="18" r="4" fill="#4A0417"/>
    <text x="32" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#4A0417" text-transform="uppercase">
      BEAUTYDOOR WELLNESS
    </text>

    <!-- Main Title -->
    <text x="0" y="110" font-family="'Playfair Display', serif" font-size="64" font-weight="400" fill="#1F1A1C" letter-spacing="-1">
      Rose Petal Mani-Pedi
    </text>
    <text x="0" y="185" font-family="'Playfair Display', serif" font-size="64" font-style="italic" font-weight="500" fill="#4A0417" letter-spacing="-1">
      &amp; Foot Spa Therapy.
    </text>

    <!-- Subtitle -->
    <text x="0" y="245" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="400" fill="#6B5A5C">
      <tspan x="0" dy="0">Effervescent botanical soaks, dead skin callus smoothing,</tspan>
      <tspan x="0" dy="30">and hospital-grade autoclaved stainless steel cuticle care.</tspan>
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 330)">
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="8" fill="#FFFFFF" stroke="#E8DDD3" stroke-width="1" filter="url(#pediShadow)"/>
        <text x="18" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#4A0417">Autoclaved Tools</text>
      </g>
      <g transform="translate(196, 0)">
        <rect width="200" height="42" rx="8" fill="#FFFFFF" stroke="#E8DDD3" stroke-width="1" filter="url(#pediShadow)"/>
        <text x="18" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#4A0417">Rose Effervescence</text>
      </g>
      <g transform="translate(412, 0)">
        <rect width="180" height="42" rx="8" fill="#FFFFFF" stroke="#E8DDD3" stroke-width="1" filter="url(#pediShadow)"/>
        <text x="18" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#4A0417">Deep Callus Peel</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Luxury Spa Pedicure Artwork Still Life -->
  <g transform="translate(1130, 470)">
    
    <!-- Outer Floor Shadow -->
    <ellipse cx="0" cy="190" rx="300" ry="60" fill="#DACBBF" fill-opacity="0.5" filter="url(#pediShadow)"/>

    <!-- Pristine Modern Minimalist White Ceramic Foot Spa Basin -->
    <g filter="url(#pediShadow)">
      <!-- Basin Body Exterior Curve -->
      <path d="M -210,0 C -210,130 210,130 210,0 C 210,-40 -210,-40 -210,0 Z" fill="#E8DFD5"/>
      <path d="M -200,0 C -200,120 200,120 200,0 C 200,-35 -200,-35 -200,0 Z" fill="url(#ceramicBasin)"/>
      
      <!-- Outer Rim -->
      <ellipse cx="0" cy="-5" rx="200" ry="65" fill="#FFFFFF"/>
      <ellipse cx="0" cy="-3" rx="194" ry="62" stroke="#E2D6C9" stroke-width="2" fill="none"/>
      
      <!-- Inner Basin Depth & Water Surface -->
      <ellipse cx="0" cy="3" rx="180" ry="54" fill="url(#spaWater)"/>

      <!-- Concentric Water Ripples -->
      <ellipse cx="-15" cy="10" rx="140" ry="38" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.75" fill="none"/>
      <ellipse cx="-15" cy="10" rx="100" ry="26" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.6" fill="none"/>
      <ellipse cx="-15" cy="10" rx="60" ry="16" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.5" fill="none"/>

      <!-- Floating Velvety Rose Petals in Basin Water -->
      <!-- Petal 1 (Center Left) -->
      <path d="M -45,-5 C -65,-25 -25,-35 -35,5 C -45,15 -60,5 -45,-5 Z" fill="url(#rosePetal)"/>
      <path d="M -43,-3 C -55,-15 -30,-22 -37,3 Z" fill="url(#lightPetal)"/>

      <!-- Petal 2 (Center Right) -->
      <path d="M 60,15 C 80,-5 95,20 65,30 C 45,35 50,25 60,15 Z" fill="url(#rosePetal)"/>
      <path d="M 62,17 C 75,5 85,20 67,26 Z" fill="url(#lightPetal)"/>

      <!-- Petal 3 (Top Arch) -->
      <path d="M 10,-20 C 0,-38 35,-35 25,-12 C 18,-2 15,-10 10,-20 Z" fill="url(#rosePetal)"/>

      <!-- Petal 4 (Foreground) -->
      <path d="M -15,30 C -30,20 5,10 10,35 C 5,42 -5,40 -15,30 Z" fill="url(#rosePetal)"/>

      <!-- Petal 5 (Far Right) -->
      <path d="M 110,-5 C 130,-18 135,5 115,10 Z" fill="url(#lightPetal)"/>
    </g>

    <!-- Smooth Volcanic Basalt Hot Stones on Basin Rim -->
    <g transform="translate(150, 45)" filter="url(#pediShadow)">
      <!-- Large Base Stone -->
      <ellipse cx="0" cy="15" rx="42" ry="18" fill="url(#basaltStone)"/>
      <ellipse cx="-5" cy="12" rx="20" ry="6" fill="#6B6465" fill-opacity="0.35"/>
      <!-- Medium Stone Stacked -->
      <ellipse cx="-4" cy="-2" rx="32" ry="14" fill="url(#basaltStone)"/>
      <ellipse cx="-8" cy="-5" rx="16" ry="5" fill="#6B6465" fill-opacity="0.35"/>
      <!-- Small Top Balance Stone -->
      <ellipse cx="-8" cy="-18" rx="22" ry="10" fill="url(#basaltStone)"/>
      <ellipse cx="-11" cy="-20" rx="10" ry="3" fill="#8C8485" fill-opacity="0.4"/>
    </g>

    <!-- Rolled Spa Towel with Gold Ribbon Trim -->
    <g transform="translate(-170, 70)" filter="url(#pediShadow)">
      <ellipse cx="0" cy="20" rx="40" ry="22" fill="#D5C9BE"/>
      <path d="M -40,20 C -40,-25 40,-25 40,20 L 40,65 C 40,110 -40,110 -40,65 Z" fill="#FFFFFF"/>
      <ellipse cx="0" cy="20" rx="38" ry="20" fill="#FAF7F2"/>
      <!-- Gold Ribbon Wrap -->
      <path d="M -40,42 C -40,42 0,55 40,42" stroke="#C5A880" stroke-width="4.5" fill="none"/>
      <!-- Towel Fold Texture -->
      <path d="M -25,12 C -10,20 10,20 25,12" stroke="#C5A880" stroke-width="1" stroke-opacity="0.4"/>
      <path d="M -28,25 C -10,32 10,32 28,25" stroke="#C5A880" stroke-width="1" stroke-opacity="0.4"/>
    </g>

    <!-- Professional Stainless Steel Cuticle Nipper / Grooming Tool -->
    <g transform="translate(-80, -110) rotate(35)" filter="url(#pediShadow)">
      <!-- Left Handle & Jaw -->
      <path d="M -6,-50 L 0,-65 L 6,-50 L 8,30 C 8,45 2,50 -2,50 C -6,50 -4,45 -4,30 Z" fill="url(#surgicalSteel)"/>
      <!-- Right Handle Pivot -->
      <path d="M 4,-50 L 0,-65 L -4,-50 L -6,30 C -6,45 -1,50 3,50 C 7,50 6,45 6,30 Z" fill="url(#surgicalSteel)"/>
      <!-- Hinge Pivot Screw with Burgundy Accent -->
      <circle cx="0" cy="-35" r="4" fill="#4A0417"/>
      <circle cx="0" cy="-35" r="2" fill="#C5A880"/>
      <!-- Polished Shimmer Line -->
      <line x1="-1" y1="-20" x2="-1" y2="25" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- Glass Dropper Bottle of Organic Rose Cuticle Oil -->
    <g transform="translate(130, -100)" filter="url(#pediShadow)">
      <!-- Bottle Body -->
      <rect x="-18" y="0" width="36" height="65" rx="8" fill="#4A0417" fill-opacity="0.8"/>
      <rect x="-15" y="4" width="6" height="57" rx="3" fill="#FFFFFF" fill-opacity="0.35"/>
      <!-- Label -->
      <rect x="-17" y="16" width="34" height="28" rx="2" fill="#FAF7F2"/>
      <rect x="-12" y="24" width="24" height="1.8" fill="#4A0417"/>
      <rect x="-8" y="30" width="16" height="1.2" fill="#C5A880"/>
      <!-- Dropper Neck & Cap -->
      <rect x="-10" y="-12" width="20" height="12" rx="2" fill="#C5A880"/>
      <rect x="-7" y="-20" width="14" height="8" rx="3" fill="#2A020D"/>
    </g>

  </g>

  <!-- Bottom Aesthetic Border -->
  <rect x="0" y="892" width="1600" height="8" fill="#4A0417"/>
  <rect x="0" y="892" width="480" height="8" fill="#C5A880"/>
</svg>
