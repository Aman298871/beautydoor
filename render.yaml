services:
  - type: web
    name: beautydoor
    env: node
    plan: starter # Starter plan or above supports Render Persistent Disks
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    disk:
      name: beautydoor-uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: DATABASE_URL
        # If your Render Postgres database was created in the Render Dashboard,
        # set DATABASE_URL in your Web Service's 'Environment' settings tab.
        # Alternatively, if using Render Blueprints with a managed DB:
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@beautydoor.in
      - key: OWNER_NOTIFICATION_EMAIL
        value: hello@beautydoor.in
      - key: ENABLE_DEV_OTP
        value: "false"
      - key: ENABLE_RAZORPAY
        value: "true"
      - key: RAZORPAY_ENABLED
        value: "true"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
